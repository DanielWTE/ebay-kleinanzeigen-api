[project]
name = "ebay-kleinanzeigen-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "playwright>=1.49.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "uvloop>=0.21.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.4.0",
]
[tool.ruff.lint]
ignore = [
    "BLE001",
    "DTZ",
    "B008",
    "S110",
    "RUF013",
    "EXE001",
    "PLR1722",
    "B023",
    "B025",
]

[tool.pytest.ini_options]
pythonpath = ['.']
import_mode = 'importlib'
asyncio_mode = 'auto'
addopts = '-m "not integration"'
markers = ['integration: requires a running API server on localhost:8000; run with -m integration']
